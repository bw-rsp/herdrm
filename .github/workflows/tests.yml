name: Tests

# Isolated synthetic demo branch; product CI remains on the product branch.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Synthetic unread persistence screenshots
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Render unread results before and after relaunch
        run: |
          make gen
          xcodebuild test -project HerdrM.xcodeproj -scheme HerdrM -configuration Debug -derivedDataPath build -destination 'platform=macOS,arch=arm64' CODE_SIGN_IDENTITY='-' CODE_SIGN_STYLE=Manual -skipPackagePluginValidation -only-testing:HerdrMTests/AgentUnreadUIUXTests/testRelaunchRestoresOnlyUnreadResultsAndClicksPersistAcknowledgement
      - name: Save synthetic UI demos
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthetic-ui-demos
          path: /tmp/herdr-pr-demo/*.png
          if-no-files-found: error
