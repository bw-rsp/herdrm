name: Tests

# Isolated green-only demo on a fresh runner. The old implementation
# already failed its expected assertions in run 41994521012; do not rerun it.
# Product pull-request workflows remain unchanged.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Sidebar filter screenshots on a fresh runner
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Verify fixed sidebar and capture synthetic screenshots
        shell: bash
        run: |
          make gen
          set -o pipefail
          xcodebuild test -project HerdrM.xcodeproj -scheme HerdrM -configuration Debug -derivedDataPath build -destination 'platform=macOS,arch=arm64' CODE_SIGN_IDENTITY='-' CODE_SIGN_STYLE=Manual -skipPackagePluginValidation -only-testing:HerdrMTests/SidebarSpaceRevealUIUXTests/testRestoredPaneAndInputFocusKeepHighlightAlignedWithSpaceFilter 2>&1 | tee /tmp/herdr-demo-green.log
      - name: Save synthetic UI demos and assertion evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthetic-ui-demos
          path: |
            /tmp/herdr-pr-demo/*.png
            /tmp/herdr-demo-green.log
          if-no-files-found: error
