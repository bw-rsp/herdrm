name: Tests

# Isolated synthetic demo branch; product CI remains on the product branch.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Synthetic unread recovery screenshot
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Verify unread recovery and capture its XCTest attachment
        run: |
          make gen
          xcodebuild test -project HerdrM.xcodeproj -scheme HerdrM -configuration Debug -derivedDataPath build -destination 'platform=macOS,arch=arm64' CODE_SIGN_IDENTITY='-' CODE_SIGN_STYLE=Manual -skipPackagePluginValidation -only-testing:HerdrMTests/AgentUnreadUIUXTests/testRecoveryStatusEventsKeepUnreadVisibleAndPersistedUntilOpened
      - name: Export the fake sidebar attachment from the test result
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import shutil
          import subprocess
          results = list(Path('build/Logs/Test').glob('*.xcresult'))
          if len(results) != 1:
              raise SystemExit(f'Expected the single targeted test result, found {len(results)}')
          exported = Path('/tmp/herdr-unread-recovery-attachments')
          subprocess.run(['xcrun', 'xcresulttool', 'export', 'attachments', '--path', str(results[0]), '--output-path', str(exported)], check=True)
          screenshots = list(exported.rglob('*.png'))
          if len(screenshots) != 1:
              raise SystemExit(f'Expected the one fake sidebar PNG attachment, found {len(screenshots)}')
          destination = Path('/tmp/herdr-pr-demo')
          destination.mkdir(parents=True, exist_ok=True)
          shutil.copy2(screenshots[0], destination / 'unread-recovery.png')
          print('Exported the real SidebarView XCTest attachment.')
          PYCODE
      - name: Save synthetic UI demos
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthetic-ui-demos
          path: /tmp/herdr-pr-demo/*.png
          if-no-files-found: error
